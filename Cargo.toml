[package]
name = "quorum-set"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

authors = [
    "Zhang Yanpo <drdr.xp@gmail.com>",
]
categories = ["algorithms", "data-structures"]
description = "Hierarchical quorum trees with deterministic canonical IDs"
documentation = "https://docs.rs/quorum-set"
homepage = "https://github.com/drmingdrmer/quorum-set"
keywords = ["quorum", "raft", "consensus"]
license = "Apache-2.0"
repository = "https://github.com/drmingdrmer/quorum-set"
readme = "README.md"

[dependencies]
sha2 = { version = "0.10" }
validit = { version = "0.2.6", default-features = false }

[dev-dependencies]
anyhow = { version = "1.0" }
maplit = { version = "1.0.2" }

[features]
bench = []
