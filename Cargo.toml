[package]
name = "quorum-set"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

authors = [
    "Zhang Yanpo <drdr.xp@gmail.com>",
]
categories = ["algorithms", "data-structures"]
description = "Quorum sets, hierarchical quorum trees, and quorum-accepted progress tracking for consensus protocols"
documentation = "https://docs.rs/quorum-set"
homepage = "https://github.com/drmingdrmer/quorum-set"
keywords = ["quorum", "raft", "consensus"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drmingdrmer/quorum-set"
readme = "README.md"
exclude = [".github", ".gitignore", "Makefile", "rust-toolchain", "rustfmt.toml"]

[lib]
bench = false

[dependencies]
sha2 = { version = "0.10" }
validit = { version = "0.2.6", default-features = false }

[dev-dependencies]
anyhow = { version = "1.0" }
criterion = { version = "0.8.2" }
maplit = { version = "1.0.2" }

[[bench]]
name = "is_quorum"
harness = false

[[bench]]
name = "vec_progress_update"
harness = false
